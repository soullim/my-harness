<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>학교 비교 — 통과 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<style>
  :root {
    --ink: #141414;
    --canvas: #FFFFFF;
    --canvas-soft: #F3F3F3;
    --hairline: #E0E0E0;
    --muted: #707070;
    --accent: #0066FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--canvas); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; }
  .frame { width: 390px; min-height: 844px; padding: 24px 16px; }
  h1 { font-size: 28px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .lead { font-size: 17px; font-weight: 300; color: var(--muted); margin-bottom: 32px; }
  .row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
  .bar { height: 8px; border-radius: 9999px; background: var(--ink); }
  .bar.focus { background: var(--accent); }
  .tag { font-size: 12px; font-weight: 600; padding: 4px 12px; border: 1px solid var(--hairline); border-radius: 9999px; }
  .source { margin-top: 24px; padding: 8px 12px; background: var(--canvas-soft); border-radius: 16px; font-size: 12px; color: var(--muted); }
  .btn-primary { margin-top: 32px; padding: 0 16px; height: 48px; border: 0; border-radius: 9999px; background: var(--ink); color: var(--canvas); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="frame">
  <h1>학교 비교</h1>
  <p class="lead">선택한 학교 2곳을 공시 데이터로 비교해요</p>
  <div class="row"><span>은평고</span><span class="tag">학생수 중간 구간</span></div>
  <div class="bar focus"></div>
  <div class="row"><span>예시고</span><span class="tag">남녀공학</span></div>
  <div class="bar"></div>
  <p class="source">기준 2026.04.01 · 출처 학교알리미</p>
  <button class="btn-primary">조건으로 추천 받기</button>
</div>
</body>
</html>
